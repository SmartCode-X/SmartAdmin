# 依赖更新。四个生态各一条，但四条的 open-pull-requests-limit 都是 0：版本更新整体关掉，
# Dependabot 不自动开 PR，也就不往仓库里塞分支（一个 PR 一条分支，只有 main / dev 是常驻的）。
#
# 关掉的理由：一个人维护，自动 PR 的评审成本远大于收益——2026-09-06 一早就开了 11 个，
# 每个都带一条分支。抬版手工改 backend/Directory.Packages.props 一处即可。
# 想放它跑一轮：把某条的 0 改回注释里的原值，跑完再改回来。
# 安全更新不受这个上限约束，但要仓库开着 Dependabot alerts；且四条都设了 target-branch，
# 这份配置对安全更新不生效，安全 PR 会直接开在默认分支 main 上。
#
# 注意 Dependabot 只读默认分支（main）上的这份文件，改在 dev 上不生效，要合到 main 才算数。
#
# 下面的 ignore / groups 在限额为 0 时不起作用，留着是因为它们记着为什么不能抬：
# 分组只收 minor + patch，major 一律单独开 PR——混在一起时一个大版本会被十几个补丁掩护着进来，
# 2026-09-06 就这样险些把 Microsoft.OpenApi 3.x 带进内核，而 AspNetCore.OpenApi 声明的区间是 [2.7.5, 3.0.0)。
version: 2

updates:
  # 后端：版本集中在 backend/Directory.Packages.props，Dependabot 认这个文件。
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    target-branch: dev
    open-pull-requests-limit: 0 # 关掉；放开时改回 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 这三个测试驱动刻意钉在 SqlSugarCore 传递的版本上，见 Directory.Packages.props 里的注释。
      # 抬版就是版本漂移：Npgsql 10 拒绝把 Kind=Local 的 DateTime 写进 timestamptz，
      # 审计字段当场炸，而运行时真正跑的仍是 SqlSugar 带来的那个版本。它们只能跟着 SqlSugarCore 走。
      - dependency-name: "MySqlConnector"
      - dependency-name: "Microsoft.Data.SqlClient"
      - dependency-name: "Npgsql"
      # Microsoft.OpenApi 必须留在 2.x：AspNetCore.OpenApi 声明的依赖区间上界就是 3.0.0，
      # 3.x 还把 IOpenApiMediaType 的 Schema/Example 改成了只读，OpenApi 转换器编不过。
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        update-types: [minor, patch]
        patterns:
          - "Microsoft.*"
          - "System.*"
      test:
        update-types: [minor, patch]
        patterns:
          - "xunit*"
          - "Microsoft.AspNetCore.Mvc.Testing"

  # 前端 workspace（内核包 smart-admin-web + 模板，共用 web/package-lock.json）。放开时 major 仍要单独开 PR：Vite / vue-tsc / vue-router 的大版本每次都要手工验一遍构建，
  # 而且它们互相牵制——vue-router 5 要 vite ≥7，先升 Vite 才轮得到它。
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    target-branch: dev
    open-pull-requests-limit: 0 # 关掉；放开时改回 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # 文档站。
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    target-branch: dev
    open-pull-requests-limit: 0 # 关掉；放开时改回 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions：全部钉在 commit SHA 上，Dependabot 会连同尾注的版本号一起改。
  # 这条是四条里最要紧的——release.yml 那个 job 持 id-token: write，能直发 nuget.org 与 npm，
  # 关掉自动 PR 之后，action 的版本要在发版前手工过一眼。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    target-branch: dev
    open-pull-requests-limit: 0 # 关掉；放开时改回 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
