# 前端静态托管 + /api 反代 —— **备选路线**。默认交付物是 web/Caddyfile(上域名即自动签证书);
# 这份给已经有 nginx 网关、照抄进去更省事的人。两者在 https://smartcode-x.github.io/SmartAdmin/zh/guide/deployment/route-b 里并列。
# 容器里用 nginx:把 web/Dockerfile 的运行阶段换成 nginx:alpine + 这份配置即可。
#
# 浏览器只看到一个源,因此**不需要 CORS**(后端默认 deny-all,不必为此开口子)。
# 注意:光在这里写 X-Forwarded-For 没用 —— 后端要采信它还须配 SmartAdmin:Api:ForwardedHeaders
# (受信网段),否则限流按 IP 分区形同虚设(全体用户共用一个桶),登录日志记的也是代理 IP。
server {
    listen 80;

    # ── 安全响应头 ─────────────────────────────────────────────────────────────
    # 写在 server 级,各 location 自动继承 —— 但**任何 location 里再写一条 add_header,
    # 这一整组就在那个 location 失效**(nginx 的 add_header 是整组覆盖,不是合并)。
    # 要在某个 location 补头,把这几行一起抄过去。
    # always:错误响应(4xx/5xx)也要带,否则登录失败那一路就是裸的。
    #   nosniff       浏览器不再按内容猜 MIME —— 上传的文本被猜成 HTML 就是一次存储型 XSS
    #   SAMEORIGIN    不用 DENY:消费者把后台嵌进自己门户的 iframe 是真实场景,DENY 会直接嵌不了
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # HSTS 只在真跑 https 时给。给错了浏览器会记住,之后拒绝再用 http 访问该站,
    # 撤不回来,只能等 max-age 过期。所以这份 http 配置里默认注释掉;
    # 这份配置被用作 443 的 server 块、或由它自己终结 TLS 时,再打开。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传大小上限要 ≥ SmartAdmin:Upload:MaxSizeMb(默认 20MB)。
    # nginx 默认只有 1m —— 不改的话传大文件拿到的是 nginx 的 413,而不是内核那条能读懂的错误码。
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # 前端 history 路由:未命中静态文件就交给 SPA 自己解析(深链刷新不 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR 实时通知 Hub(强制下线、未读刷新):WebSocket 升级必须显式转发 Upgrade/Connection,
    # 否则握手退化成普通 HTTP、连不上,实时通知静默退回 30s 轮询。(Caddy 那份自动处理,无需此段。)
    location /hub/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 探针:编排层/负载均衡直接探这里,不必知道后端在哪
    location /health {
        proxy_pass http://app:8080;
        access_log off;
    }
}
